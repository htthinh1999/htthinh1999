name: Profile metrics

# Renders the README's metric cards from the GitHub GraphQL API and publishes
# them to the `metrics` branch. No WakaTime, no third-party services, and no
# bot commits on `main` — the branch is force-pushed with a single commit.

on:
  schedule:
    - cron: "23 17 * * *" # daily at 00:23 in Asia/Ho_Chi_Minh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile-metrics/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  publish:
    name: Build & publish cards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Generate cards
        run: npm run metrics -- --out dist
        env:
          # Personal token (classic: `repo` + `read:user`) adds private-repo
          # aggregates. Without it the cards fall back to public data only.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish to the metrics branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Update profile metrics"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics

      - name: Summary
        run: |
          jq -r '
            "### Profile metrics published",
            "",
            "| Metric | Value |",
            "| --- | --- |",
            "| Contributions in \(.year) | \(.contributions.thisYear) |",
            "| Current / longest streak | \(.streaks.current.length) / \(.streaks.longest.length) days |",
            "| Commits analysed | \(.rhythm.total) |",
            "| Languages | \([.languages.items[].name] | join(", ")) |"
          ' dist/metrics.json >> "$GITHUB_STEP_SUMMARY"
